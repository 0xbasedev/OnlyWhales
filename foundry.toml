[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "out"
cache_path = "cache"
libs = ["lib", "node_modules"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./config" }, { access = "read", path = "./out" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
]

[fuzz]
runs = 512

[invariant]
runs = 64
depth = 96
fail_on_revert = false

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 256
depth = 200

[lint]
lint_on_build = false

[fmt]
line_length = 110
